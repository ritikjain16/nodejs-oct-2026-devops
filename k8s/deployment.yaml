apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-backend-deployment
  labels:
    app: nodejs-backend
  namespace: mynodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-backend
  template:
    metadata:
      labels:
        app: nodejs-backend

    spec:
      containers:
        - name: nodejs-backend
          image: 280681471871.dkr.ecr.ap-south-1.amazonaws.com/nodejs-oct-2026:190c66bb1ddd092a8fc62e01c8dd47f0fe59b6d4-10
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            # - name: MONGO_USERNAME
            #   valueFrom:
            #     secretKeyRef:
            #       name: nodejs-mongo-secret
            #       key: MONGO_ROOT_USERNAME
            # - name: MONGO_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: nodejs-mongo-secret
            #       key: MONGO_ROOT_PASSWORD
            # # Construct the MONGO_URI
            # - name: MONGO_URI
            #   value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@nodejs-db-service:27017/nodejs_db?authSource=admin"